name: OS Compatibility

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  os:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26, macos-26-intel, xcode-27, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, windows-2025, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm, windows-11-arm, windows-11-vs2026-arm, ubuntu-slim, windows-2025-vs2026]
        version-requirement: ['5.7.19 - 5.7.29', '5.7.30 - 5.7.39', '5.7.40 - 8.0.4', '8.0.4 - 8.0.19', '8.0.20 - 8.0.29', '8.0.30 - 8.0.39', '8.0.40 - 8.0.45', '8.1.0 - 8.3.0', 8.4.0 - 9.0.0', '9.0.1 - 10.0.0', '26.7.0 - 28.0.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          check-latest: true

      - name: Install packages
        run: npm ci

      - name: Install required system packages (Ubuntu Slim only)
        if: ${{ matrix.os == 'ubuntu-slim' }}
        run: sudo apt-get update && sudo apt-get install libaio1t64 libnuma-dev

      - name: Build code
        run: npx tsc

      - name: Run tests
        env:
          VERSION_REQUIREMENT: ${{ matrix.version-requirement }}
        run: npm run os-compat:ci

      - name: Move MySQLMSN directory for GitHub Actions upload
        if: ${{ failure() }}
        env:
          MOVE_MYSQLMSN_TO: ${{ runner.os == 'Windows' && 'C:\\Users\\RUNNER~1\\mysqlmsn' || '/tmp/mysqlmsn' }}
        run: node tests/ci/DirMoveGitHubActions.js

      - name: Upload mysqlmsn directory
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.3.5
        with:
          name: os-${{ matrix.os }}-node-${{ matrix.node-version }}-mysql-${{ matrix.version-requirement }}
          path: ${{ runner.os == 'Windows' && 'C:\\Users\\RUNNER~1\\mysqlmsn' || '/tmp/mysqlmsn' }}
          compression-level: 9

  fedora-docker:
    runs-on: ubuntu-${{ matrix.ubuntu-version}}

    strategy:
      fail-fast: false
      matrix:
        version: [42, 43, 44]
        version-requirement: ['5.7.19 - 5.7.29', '5.7.30 - 5.7.39', '5.7.40 - 8.0.4', '8.0.4 - 8.0.19', '8.0.20 - 8.0.29', '8.0.30 - 8.0.39', '8.0.40 - 8.0.45', '8.1.0 - 8.3.0', 8.4.0 - 9.0.0', '9.0.1 - 10.0.0', '26.7.0 - 28.0.0']
        ubuntu-version: [24.04, 24.04-arm]

    container: fedora:${{ matrix.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          check-latest: true

      - name: Install required libraries
        run: sudo dnf install libaio numactl libxcrypt-compat -y

      - name: Install packages
        run: npm ci

      - name: Print available storage space
        run: df -h

      - name: Build code
        run: npx tsc

      - name: Run tests
        env:
          VERSION_REQUIREMENT: ${{ matrix.version-requirement }}
        run: npm run os-compat:ci

      - name: Upload mysqlmsn directory
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.3.5
        with:
          name: docker-fedora-${{ matrix.version }}-${{ matrix.version-requirement }}-${{ matrix.ubuntu-version}}
          path: /tmp/mysqlmsn
          compression-level: 9

  alpine-docker:
    runs-on: ubuntu-${{ matrix.ubuntu-version}}

    strategy:
      fail-fast: false
      matrix:
        version-requirement: [ '8.4.0 - 8.4.4', '8.4.5 - 9.0.0', '9.0.1 - 9.4.0', '9.5.0 - 9.6.0']
        ubuntu-version: [24.04, 24.04-arm]
        alpine-version: ['3.20', 3.21, 3.22, 3.23, 3.24]

    container: alpine:${{ matrix.alpine-version }}

    steps:
      - name: Install required libraries for test setup
        run: apk add git nodejs npm

      - name: Install required libraries for MySQL on alpine
        run: apk add libaio libstdc++

      - name: Clone Repository
        run: git clone https://github.com/${{ github.repository }} --branch ${{ github.head_ref || github.ref_name }} --single-branch mysqlmsn

      - name: Checkout code
        working-directory: mysqlmsn
        run: git reset --hard ${{ github.event.after }}

      - name: Install packages
        working-directory: mysqlmsn
        run: npm ci

      - name: Print available storage space
        run: df -h

      - name: Build code
        working-directory: mysqlmsn
        run: npx tsc

      - name: Run tests
        working-directory: mysqlmsn
        env:
          VERSION_REQUIREMENT: ${{ matrix.version-requirement }}
          X_OFF: true
        run: npm run os-compat:ci