name: Node.js Compatibility

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26, ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025, ubuntu-22.04-arm, ubuntu-24.04-arm, windows-11-arm, ubuntu-slim, windows-2025-vs2026]
        node-version: [18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x]
        # Exclude Node 18.x on Windows on Arm because Node only provides Windows on Arm binaries for Node >= 19
        exclude:
          - os: windows-11-arm
            node-version: 18.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true

      - name: Log Node version
        run: node -v

      - name: Install packages
        run: npm ci

      - name: Install required system packages (Ubuntu Slim only)
        if: ${{ matrix.os == 'ubuntu-slim' }}
        run: sudo apt-get update && sudo apt-get install libaio1t64 libnuma-dev

      - name: Build code
        run: npx tsc

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Log Node version
        run: node -v

      - name: Run tests
        run: npm run test:ci

      - name: Move MySQLMSN directory for GitHub Actions upload
        if: ${{ failure() }}
        env:
          MOVE_MYSQLMSN_TO: ${{ runner.os == 'Windows' && 'C:\\Users\\RUNNER~1\\mysqlmsn' || '/tmp/mysqlmsn' }}
        run: node tests/ci/DirMoveGitHubActions.js

      - name: Upload mysqlmsn directory
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.node-version }}
          path: ${{ runner.os == 'Windows' && 'C:\\Users\\RUNNER~1\\mysqlmsn' || '/tmp/mysqlmsn' }}
          compression-level: 9